# KickLive CI — PR/push quality gate. Source of truth for this file is ci/workflows/ci.yml;
# `.github/workflows/ci.yml` is a copy (see "npm run ci:install" / docs/RELEASE-PIPELINE.md §1).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  quality:
    name: Gates 1+4+5 (typecheck, tests, policy, branding)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Workflows installed from ci/workflows
        run: npm run ci:check
      - name: Typecheck (renderer+shared, scripts+server+desktop)
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Aggregate verify (branding, version, hooks, vercel.json, manifest templates)
        run: npm run verify
      - name: Unit + integration tests
        run: npm test
      - name: Update contract (manifest samples)
        run: |
          node scripts/update-manifest.mjs validate packaging/updates/manifest.sample.json
          node scripts/update-manifest.mjs validate packaging/updates/manifest.beta.json
      - name: Gate summary
        if: always()
        run: |
          {
            echo "### Gate 1/4/5 summary"
            echo '```'
            node scripts/gates.mjs --only=1,4,5 --skip=6 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Gates 2+3 (web build, packaging layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web + PWA + renderer + desktop bundles
        run: npm run build
      - name: "Layout tests (tier A: renderer/dist, asar, hooks, identity, version)"
        run: node scripts/verify-packaging.mjs
      - name: Serve the built web bundle and assert the static-server contract
        run: |
          node server/cli.ts --root dist/web --port 4173 --quiet & echo $! > /tmp/serve.pid
          sleep 1
          set -e
          code() { curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:4173$1"; }
          type() { curl -sSI "http://127.0.0.1:4173$1" | tr -d '\r' | awk -v k="content-type:" 'tolower($0) ~ k {sub(k," ");print;exit}'; }
          test "$(code /)" = 200
          test "$(code /admin/anything)" = 200
          [ "$(code /assets/nope-does-not-exist.js)" = 404 ] || { echo "missing asset must 404"; exit 1; }
          JS=$(ls dist/web/assets/*.js | head -1 | xargs basename)
          test "$(code /assets/$JS)" = 200
          test "$(type /assets/$JS)" = "text/javascript; charset=utf-8"
          test "$(type /site.webmanifest)" = "application/manifest+json"
          kill "$(cat /tmp/serve.pid)"
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-web-dist
          path: dist/web
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-renderer-dist
          path: renderer/dist
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Gates 2+3 (Linux .deb/AppImage + xvfb smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install X11/packaging tools
        run: bash scripts/ci/setup-linux-tools.sh
      - name: Build everything
        run: npm run build
      - name: Package Linux artifacts (electron-builder)
        run: npm run package:linux -- --require-full
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      - uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: "Full layout tests (tier B + C: linux-unpacked, .deb fields, desktop file, icons)"
        run: node scripts/verify-packaging.mjs --require-full
      - name: Smoke the built binary under xvfb (happy path + broken load path)
        run: bash scripts/ci/desktop-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicklive-smoke-logs
          path: release/smoke-*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-packaging-report
          path: |
            release/packaging-report.json
            release/checksums.json
            release/artifacts.json
          if-no-files-found: error
          retention-days: 30
