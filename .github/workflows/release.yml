# KickLive release — one tag, two surfaces, one update manifest (docs/RELEASE-PIPELINE.md § release).
#
# Trigger: `git tag v1.2.3 && git push origin v1.2.3`, or workflow_dispatch with a version + channel.
# Output: a GitHub Release carrying kicklive_<ver>_amd64.deb, kicklive_<ver>_arm64.deb,
#         KickLive-<ver>-x86_64.AppImage, the update manifest and checksums.
# Nothing is auto-promoted to the stable channel except by this workflow: the stable manifest is
# attached to the release that `releases/latest/download/` resolves to.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal VERSION in the repo)"
        required: true
        type: string
      channel:
        description: "Update channel"
        type: choice
        required: true
        default: stable
        options: [stable, beta]
      draft:
        description: "Create as a draft release"
        type: boolean
        default: false

permissions:
  contents: write # release + assets + the moving channel tag
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.18.0"

jobs:
  preflight:
    name: Version, secrets, gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Resolve version + channel
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          file="$(cat VERSION)"
          input="${{ github.event.inputs.version }}"
          version="${input:-${tag#v}}"
          if [ "${tag#v}" != "$file" ] && [ -n "$input" ] && [ "$input" != "$file" ]; then
            echo "::error::refusing to release: tag/input v${version} does not match VERSION ($file). Bump with: npm run version:write -- patch"
            exit 1
          fi
          channel="${{ github.event.inputs.channel || 'stable' }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publishing v$version to the $channel channel"
      - name: Secrets audit
        run: node scripts/check-secrets.mjs --job=release
      - name: Required gates before packaging
        run: |
          npm run typecheck
          npm run format:check
          npm test
          npm run verify
      - name: Rehearse the clean-VM path (gate 6)
        run: node scripts/gates.mjs --only=6

  desktop:
    name: Desktop ${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install X11/packaging tools
        run: bash scripts/ci/setup-linux-tools.sh
      - name: Build
        run: npm run build
      - name: Package
        run: npm run package:linux -- --require-full
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      - uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ matrix.arch }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Full layout tests against the real artifacts
        run: node scripts/verify-packaging.mjs --require-full
      - name: "Smoke the built binary (x64 only: the runner cannot execute arm64)"
        if: matrix.arch == 'x64'
        run: bash scripts/ci/desktop-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.AppImage
            release/checksums.json
            release/artifacts.json
            release/packaging-report.json
            release/smoke-*.log
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web + PWA bundle
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web bundle
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
      - name: Verify the built bundle answers over the hardened server
        run: |
          node scripts/verify-packaging.mjs
          node server/cli.ts --root dist/web --port 4173 --quiet & pid=$!
          sleep 1
          curl -fsS http://127.0.0.1:4173/version.json | tee /tmp/version.json
          grep -q '"version": *"${{ needs.preflight.outputs.version }}"' /tmp/version.json
          curl -fsS http://127.0.0.1:4173/sw.js | head -1
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release + update manifest
    needs: [preflight, desktop, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist/web
      - name: Build the update manifest from the real artifacts
        run: |
          set -euo pipefail
          channel="${{ needs.preflight.outputs.channel }}"
          npm run update-manifest -- build \
            --version "${{ needs.preflight.outputs.version }}" \
            --channel "$channel" \
            --release-dir release \
            --out "release/kicklive-update-${channel}.json" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v${{ needs.preflight.outputs.version }}"
          node scripts/update-manifest.mjs validate "release/kicklive-update-${channel}.json"
      - name: Assemble the release body
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          {
            echo "## KickLive $version"
            echo
            echo '```text'
            node -e 'const c=require("./release/checksums.json");for(const [k,v] of Object.entries(c.files))console.log(v.slice(0,16)+"  "+k)'
            echo '```'
            echo
            echo "Download the .deb if you want apt/dpkg to own updates; the AppImage needs no root."
            echo "Desktop installs pick this build up from the \`${{ needs.preflight.outputs.channel }}\` update channel once the tag is published."
          } > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          channel="${{ needs.preflight.outputs.channel }}"
          tag="v${version}"
          args=(release create "$tag" \
            --title "KickLive $version" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA")
          [ "${{ github.event.inputs.draft }}" = "true" ] && args+=(--draft)
          [ "$channel" = "beta" ] && args+=(--prerelease)
          gh "${args[@]}" \
            release/*.deb \
            release/*.AppImage \
            "release/kicklive-update-${channel}.json" \
            release/checksums.json \
            release/artifacts.json \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || {
            # Re-running a release: update the assets instead of failing on an existing tag.
            gh release upload "$tag" release/*.deb release/*.AppImage "release/kicklive-update-${channel}.json" release/checksums.json release/artifacts.json --clobber
          }
      - name: Point the beta channel at this release
        if: needs.preflight.outputs.channel == 'beta'
        run: |
          set -euo pipefail
          git tag -f "update-channel-beta" "$GITHUB_SHA"
          git push -f origin "refs/tags/update-channel-beta"
          echo "beta clients now follow $GITHUB_REF_NAME (moving tag update-channel-beta)"
      - name: Prove the published manifest is what a client will read
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          channel="${{ needs.preflight.outputs.channel }}"
          if [ "$channel" = "stable" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/kicklive-update-stable.json"
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/update-channel-beta/kicklive-update-beta.json"
          fi
          sleep 5
          curl -fsSL "$url" -o /tmp/published.json
          node scripts/update-manifest.mjs validate /tmp/published.json
          node -e '
            const m=require("/tmp/published.json");
            const want=process.argv[1];
            if(m.version!==want) throw new Error("published manifest says "+m.version+", expected "+want);
            if(!m.platforms.linux_x64||!m.platforms.linux_x64.url) throw new Error("no linux_x64 artifact in the published manifest");
            console.log("published manifest OK:",m.version,"->",m.platforms.linux_x64.url);
            if(!m.platforms.linux_x64.url.includes(want)) throw new Error("artifact url does not carry the version");
          ' "$version"
          # The download URL must actually deliver the bytes the manifest promises.
          url_of=$(node -e 'console.log(require("/tmp/published.json").platforms.linux_x64.url)')
          curl -fsSL "$url_of" -o /tmp/pkg.deb
          test "$(sha256sum /tmp/pkg.deb | cut -d' ' -f1)" = "$(node -e 'console.log(require("/tmp/published.json").platforms.linux_x64.sha256)')" \
            || { echo "::error::published .deb sha256 does not match the manifest" >&2; exit 1; }
          echo "artifact checksum verified against the published manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: release/kicklive-update-*.json
          if-no-files-found: error
