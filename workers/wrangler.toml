# ============================================================================
#  Kick Live API Worker — Cloudflare configuration
#
#  One Worker, three named environments. `name` is what Cloudflare deploys, so staging and
#  production get separate Worker instances and separate secrets:
#
#    npx wrangler dev     --config workers/wrangler.toml                      # top-level [vars] = development
#    npx wrangler deploy  --config workers/wrangler.toml --env staging
#    npx wrangler deploy  --config workers/wrangler.toml --env production
#
#  Secrets live only in the Cloudflare dashboard / `wrangler secret put`, per environment:
#
#    npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
#    npx wrangler secret put SUPABASE_JWT_SECRET       --env production
#    npx wrangler secret put TURNSTILE_SECRET_KEY      --env production
#
#  A staging key deployed to production (or the reverse) is the incident this layout prevents;
#  `SUPABASE_PROJECT_REF` below is what makes that a startup error instead of a data mix-up.
#
#  THIS FILE MUST NEVER CONTAIN: a service-role key, a JWT secret, a real project's publishable
#  key, an `env_file` pointing at a real .env, or `ALLOWED_ORIGINS = "*"`.
# ============================================================================

name = "kicklive-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = "off"

# ─────────────────────────────────────────────────────────────────────────
# DEVELOPMENT — the top-level block, used by `wrangler dev`.
# Reads point at the *staging* project. There is no path from this block to production data:
# no production secret is set on this Worker instance, and the URL below must not be a
# production ref (the `SUPABASE_PROJECT_REF` check in services/supabase.ts enforces the pair).
# ─────────────────────────────────────────────────────────────────────────
[vars]
APP_ENV = "development"
SUPABASE_URL = "https://REPLACE-WITH-STAGING-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-STAGING-REF"
# Publishable/anon key: public by design (the browser ships it), safe in this file.
SUPABASE_ANON_KEY = "REPLACE-WITH-STAGING-PUBLISHABLE-KEY"
# Exact origins only; `*` is rejected by env.ts. These are the local SPA ports this repo uses.
ALLOWED_ORIGINS = "http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://127.0.0.1:5173"
# Secrets for local dev come from workers/.dev.vars (git-ignored) — see .dev.vars.example.
# RATE_LIMIT_KV is intentionally unbound in development: the limiter falls back to a per-isolate
# counter and says so in `x-ratelimit-store: memory`.

# ─────────────────────────────────────────────────────────────────────────
# STAGING — the rehearsal environment. Same schema, different project, different keys.
# ─────────────────────────────────────────────────────────────────────────
[env.staging]
name = "kicklive-api-staging"

[env.staging.vars]
APP_ENV = "staging"
SUPABASE_URL = "https://REPLACE-WITH-STAGING-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-STAGING-REF"
SUPABASE_ANON_KEY = "REPLACE-WITH-STAGING-PUBLISHABLE-KEY"
# The staging SPA origin, plus the Arena/preview hosts used during review, each spelled exactly.
ALLOWED_ORIGINS = "https://staging.kicklive.football"

# [env.staging.routes] is deployment-time: uncomment with a real zone once DNS exists.
# [[env.staging.routes]]
# pattern = "api.staging.kicklive.football/*"
# custom_domain = false

# [[env.staging.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "create with: npx wrangler kv namespace create RATE_LIMIT_KV --env staging"

# ─────────────────────────────────────────────────────────────────────────
# PRODUCTION
# ─────────────────────────────────────────────────────────────────────────
[env.production]
name = "kicklive-api"

[env.production.vars]
APP_ENV = "production"
SUPABASE_URL = "https://REPLACE-WITH-PRODUCTION-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-PRODUCTION-REF"
SUPABASE_ANON_KEY = "REPLACE-WITH-PRODUCTION-PUBLISHABLE-KEY"
# The packaged desktop renderer must be listed too, or desktop builds fail on every API call while
# the web app works — the worst possible shape for a bug report. Add its origin when Phase 2 ships
# the API to the desktop shell.
ALLOWED_ORIGINS = "https://kicklive.football,https://www.kicklive.football"

# [[env.production.routes]]
# pattern = "api.kicklive.football/*"
# custom_domain = false

# [[env.production.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "create with: npx wrangler kv namespace create RATE_LIMIT_KV --env production"

[env.production.observability]
[env.production.observability.logs]
enabled = true
# Invocation logs are the second half of the audit trail: `audit_log` says what was done, these say
# which request did it. Keep the retention window aligned with the audit table.
invocation_logs = true

# ─────────────────────────────────────────────────────────────────────────
# PLANNED BINDINGS — deliberately inactive until the phase that owns them.
#
# [[r2_buckets]]      # Phase 4 — media plane (replaces inline URLs / unsplash hotlinks)
# [[queues.producers]]# Phase 4 — standings recompute, notification fan-out
# [[queues.consumers]]# max_batch_size = 10, max_retries = 3, dead-letter queue
# [durable_objects]   # Phase 3 — one MatchRoom per match_id
#
# [[d1_databases]]    # INTENTIONALLY ABSENT — do not "helpfully" add one.
# D1 would be a second copy of match data with a sync job in the middle. Supabase Postgres is the
# source of truth for every business table; D1 is only ever justified later for Worker-owned
# ephemeral state, and that needs its own reviewed migration. See workers/README.md.
# ─────────────────────────────────────────────────────────────────────────
