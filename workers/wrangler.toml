#  sentence, so the pair cannot drift apart quietly.
APP_ENV = "staging"
SUPABASE_URL = "https://fnefpcjeebawsebxjhcf.supabase.co"
SUPABASE_PROJECT_REF = "fnefpcjeebawsebxjhcf"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZuZWZwY2plZWJhd3NlYnhqaGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDAyMTQsImV4cCI6MjA5OTYxNjIxNH0.YkPu5IxtEPZHK9i0oiMTRROrwCT3ZdF1RgCEhaqDhwo"
# The staging SPA origin, plus the Arena/preview hosts used during review, each spelled exactly.
ALLOWED_ORIGINS = "https://staging.kicklive.football"
# Named environments do not inherit [vars], and MEDIA_MAX_BYTES lives here only so the ceiling is
# explicit: without this line the environment runs the built-in default (25 MiB) and wrangler warns
# on every deploy. Change media sizes per environment, not at the top, or the change lands in dev only.
MEDIA_MAX_BYTES = 26214400

# [env.staging.routes] is deployment-time: uncomment with a real zone once DNS exists.
# [[env.staging.routes]]
# pattern = "api.staging.kicklive.football/*"
# custom_domain = false

# Created 2026-09-10 as `staging-RATE_LIMIT_KV`. This block is the difference between a global
# limiter and a per-isolate one: the middleware answers with `x-ratelimit-store: kv` while the
# binding exists and `memory` the moment it disappears, so losing it is visible, not silent.
[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "14daf4b0404c42039317166e1d03f62d"

# Named environments do not inherit top-level bindings, so the room is declared per environment.# The queue and the cron are repeated per environment rather than inherited — `[[env.staging.*]]` blocks see
# no top-level bindings, so declaring them once would mean notifications work in dev and are silently absent in
# staging. This is the same reason `durable_objects.bindings` is repeated above.
# Phase 6 · per-environment media bucket, repeated because named environments inherit no top-level
# bindings at all (see the ordering note above).
[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "kicklive-media-staging"

[[env.staging.queues.producers]]
queue = "kicklive-notifications-staging"
binding = "NOTIFICATION_QUEUE"

[[env.staging.queues.consumers]]
queue = "kicklive-notifications-staging"
max_batch_size = 25
max_batch_timeout = 20
max_retries = 6
max_concurrency = 5

dead_letter_queue = "kicklive-notifications-failed-staging"

# Ad measurement (Phase 7). A second queue rather than a second message type on the notification queue
# because the two want opposite delivery policies: a notification job is a wake-up for a row that already
# exists (retry until the sweep catches it), while an ad event is the record itself, written once and
# deduplicated below us. Sharing one consumer would force one retry policy on both, and the notification
# side's `max_retries = 6` would mean a poison ad batch is replayed six times against a table whose only
# guard is a unique key. Same Worker, so `queue` in `index.ts` discriminates by queue name.
#
# `max_batch_size = 100` matches the consumer's own cap: a batch the size of the insert the RPC will perform
# means one database call per batch rather than one per message, which is the entire reason the rollup stays
# cheap. `max_retries = 2` is small on purpose — a failed insert retries the whole batch, and the unique
# `dedupe_key` turns the retry into a no-op for rows that did land, so more retries cost nothing but delay.
[[env.staging.queues.producers]]
queue = "kicklive-ad-events-staging"
binding = "AD_EVENTS_QUEUE"

[[env.staging.queues.consumers]]
queue = "kicklive-ad-events-staging"
max_batch_size = 100
max_batch_timeout = 10
max_retries = 2
max_concurrency = 5

# No dead-letter queue for measurements. A message that survives two retries has already lost its day:
# an impression is counted per UTC day, so a redelivery from a DLQ a week later would be refused by the
# horizon check anyway, and a queue nobody reads is a cost with no recovery path behind it.

[env.staging.triggers]
# The media cron string must equal MEDIA_SWEEP_CRON in src/services/mediaStore.ts (asserted in tests).
crons = ["*/5 * * * *", "17 * * * *"]

[[env.staging.durable_objects.bindings]]
name = "LIVE_MATCH_ROOM"
class_name = "MatchRoom"

[[env.staging.migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["MatchRoom"]

