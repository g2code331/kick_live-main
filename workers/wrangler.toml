# ============================================================================
#  Kick Live API Worker — Cloudflare configuration
#
#  One Worker, three named environments. `name` is what Cloudflare deploys, so staging and
#  production get separate Worker instances and separate secrets:
#
#    npx wrangler dev     --config workers/wrangler.toml                      # top-level [vars] = development
#    npx wrangler deploy  --config workers/wrangler.toml --env staging
#    npx wrangler deploy  --config workers/wrangler.toml --env production
#
#  Secrets live only in the Cloudflare dashboard / `wrangler secret put`, per environment:
#
#    npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
#    npx wrangler secret put SUPABASE_JWT_SECRET       --env production
#    npx wrangler secret put TURNSTILE_SECRET_KEY      --env production
#
#  A staging key deployed to production (or the reverse) is the incident this layout prevents;
#  `SUPABASE_PROJECT_REF` below is what makes that a startup error instead of a data mix-up.
#
#  THIS FILE MUST NEVER CONTAIN: a service-role key, a JWT secret, a real project's publishable
#  key, an `env_file` pointing at a real .env, or `ALLOWED_ORIGINS = "*"`.
# ============================================================================

name = "kicklive-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = "off"

# ─────────────────────────────────────────────────────────────────────────
# DEVELOPMENT — the top-level block, used by `wrangler dev`.
# Reads point at the *staging* project. There is no path from this block to production data:
# no production secret is set on this Worker instance, and the URL below must not be a
# production ref (the `SUPABASE_PROJECT_REF` check in services/supabase.ts enforces the pair).
# ─────────────────────────────────────────────────────────────────────────
[vars]
APP_ENV = "development"
SUPABASE_URL = "https://REPLACE-WITH-STAGING-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-STAGING-REF"
# Publishable/anon key: public by design (the browser ships it), safe in this file.
SUPABASE_ANON_KEY = "REPLACE-WITH-STAGING-PUBLISHABLE-KEY"
# Exact origins only; `*` is rejected by env.ts. These are the local SPA ports this repo uses.
ALLOWED_ORIGINS = "http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://127.0.0.1:5173"
# Secrets for local dev come from workers/.dev.vars (git-ignored) — see .dev.vars.example.
# RATE_LIMIT_KV is intentionally unbound in development: the limiter falls back to a per-isolate
# counter and says so in `x-ratelimit-store: memory`.

# Phase 3: the live match room. One instance per match id (`idFromName(String(match_id))`), holding the
# sockets and the write queue for that match. `class_name` must match the exported class in
# `src/do/MatchRoom.ts`, and the `migrations` block below is what creates it — an existing environment
# that adds a class needs a NEW tag; reusing a tag makes wrangler refuse, which is the safe direction.
[[durable_objects.bindings]]
name = "LIVE_MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["MatchRoom"]

# ─────────────────────────────────────────────────────────────────────────
# STAGING — the rehearsal environment. Same schema, different project, different keys.
# ─────────────────────────────────────────────────────────────────────────
# Phase 5 · the notification queue and the sweep. Declared here, at the top level, and then repeated per
# environment below — TOML tables are positional, so an active `[[queues.producers]]` written *after*
# `[env.staging]` would silently become `env.staging.queues.producers` instead of the top-level one. That is a
# whole class of "works locally, absent in production" bug, and
# `tests/unit/phase2-api-boundary.test.ts` now asserts the ordering.
#
# The queue is a wake-up, never the record (§11 of docs/NOTIFICATIONS_ARCHITECTURE.md), so the numbers below are
# sized for a goal, not for a demo: 25 jobs per batch (one message is one job), 5 concurrent batches, and a
# retry budget that matches the job's own so a message cannot outlive its record.
# ─────────────────────────────────────────────────────────────────────────
# Phase 5 activated the queue. It is bound because code depends on it now — `index.ts` exports `queue` and
# `scheduled`, and the notification jobs are fanned out by `queues/notifications.ts` — and the two numbers
# Cloudflare lets you tune are set for a goal, not for a demo:
#
#   max_batch_size    the queue carries *job ids*; one message is one job, so 25 messages is 25 notifications
#                     (the 500-token batches are inside `deliverJob`; Cloudflare caps this at 100 anyway).
#   max_concurrency   5 batches in flight per instance; FCM's per-project rate is the reason it is not 50.
#   max_retries +     the consumer never drops a message on the floor: a job that keeps failing is left
#   backoff           `retry` in the database and the sweep re-enqueues it, so the DLQ is for poison messages.

[[queues.producers]]
queue = "kicklive-notifications-dev"
binding = "NOTIFICATION_QUEUE"

[[queues.consumers]]
queue = "kicklive-notifications-dev"
max_batch_size = 25
max_batch_timeout = 20
max_retries = 6
min_instances = 0
max_concurrency = 5
backoff_delay_ms = 10000
backoff_max_delay_ms = 600000

# Poison messages only, by the rule above. The queue itself must be created first
# (`npx wrangler queues create <name>-dev` etc. as well), or the deploy fails with a
# "queue not found" that has nothing to do with the code.
  [queues.consumers.dead_letter_queue]
  queue = "kicklive-notifications-failed-dev"
  max_batch_size = 10

[triggers]
# The five-minute safety net (docs/NOTIFICATIONS_ARCHITECTURE.md §11): re-enqueue anything the queue lost,
# and prune long-dead device rows on the hour. `*/5 * * * *` is UTC.
crons = ["*/5 * * * *"]
#

# ─────────────────────────────────────────────────────────────────────────
[env.staging]
name = "kicklive-api-staging"

[env.staging.vars]
APP_ENV = "staging"
SUPABASE_URL = "https://REPLACE-WITH-STAGING-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-STAGING-REF"
SUPABASE_ANON_KEY = "REPLACE-WITH-STAGING-PUBLISHABLE-KEY"
# The staging SPA origin, plus the Arena/preview hosts used during review, each spelled exactly.
ALLOWED_ORIGINS = "https://staging.kicklive.football"

# [env.staging.routes] is deployment-time: uncomment with a real zone once DNS exists.
# [[env.staging.routes]]
# pattern = "api.staging.kicklive.football/*"
# custom_domain = false

# [[env.staging.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "create with: npx wrangler kv namespace create RATE_LIMIT_KV --env staging"

# Named environments do not inherit top-level bindings, so the room is declared per environment.# The queue and the cron are repeated per environment rather than inherited — `[[env.staging.*]]` blocks see
# no top-level bindings, so declaring them once would mean notifications work in dev and are silently absent in
# staging. This is the same reason `durable_objects.bindings` is repeated above.
[[env.staging.queues.producers]]
queue = "kicklive-notifications-staging"
binding = "NOTIFICATION_QUEUE"

[[env.staging.queues.consumers]]
queue = "kicklive-notifications-staging"
max_batch_size = 25
max_batch_timeout = 20
max_retries = 6
min_instances = 0
max_concurrency = 5
backoff_delay_ms = 10000
backoff_max_delay_ms = 600000

  [env.staging.queues.consumers.dead_letter_queue]
  queue = "kicklive-notifications-failed-staging"
  max_batch_size = 10

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.durable_objects.bindings]]
name = "LIVE_MATCH_ROOM"
class_name = "MatchRoom"

[[env.staging.migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["MatchRoom"]

# ─────────────────────────────────────────────────────────────────────────
# PRODUCTION
# ─────────────────────────────────────────────────────────────────────────
[env.production]
name = "kicklive-api"

[env.production.vars]
APP_ENV = "production"
SUPABASE_URL = "https://REPLACE-WITH-PRODUCTION-REF.supabase.co"
SUPABASE_PROJECT_REF = "REPLACE-WITH-PRODUCTION-REF"
SUPABASE_ANON_KEY = "REPLACE-WITH-PRODUCTION-PUBLISHABLE-KEY"
# The packaged desktop renderer must be listed too, or desktop builds fail on every API call while
# the web app works — the worst possible shape for a bug report. Add its origin when Phase 2 ships
# the API to the desktop shell.
ALLOWED_ORIGINS = "https://kicklive.football,https://www.kicklive.football"

# [[env.production.routes]]
# pattern = "api.kicklive.football/*"
# custom_domain = false

# [[env.production.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "create with: npx wrangler kv namespace create RATE_LIMIT_KV --env production"
# The queue and the cron are repeated per environment rather than inherited — `[[env.staging.*]]` blocks see
# no top-level bindings, so declaring them once would mean notifications work in dev and are silently absent in
# staging. This is the same reason `durable_objects.bindings` is repeated above.
[[env.production.queues.producers]]
queue = "kicklive-notifications"
binding = "NOTIFICATION_QUEUE"

[[env.production.queues.consumers]]
queue = "kicklive-notifications"
max_batch_size = 25
max_batch_timeout = 20
max_retries = 6
min_instances = 0
max_concurrency = 5
backoff_delay_ms = 10000
backoff_max_delay_ms = 600000

  [env.production.queues.consumers.dead_letter_queue]
  queue = "kicklive-notifications-failed"
  max_batch_size = 10

[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.production.durable_objects.bindings]]
name = "LIVE_MATCH_ROOM"
class_name = "MatchRoom"

# Production keeps its own tag history: rooms already created in staging are not carried over, and that
# is correct — a match's live state is rebuildable from Postgres, which is why losing a Durable Object
# (or a whole environment's worth of them) is an outage of convenience, not a data-loss event.
[[env.production.migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["MatchRoom"]

[env.production.observability]
[env.production.observability.logs]
enabled = true
# Invocation logs are the second half of the audit trail: `audit_log` says what was done, these say
# which request did it. Keep the retention window aligned with the audit table.
invocation_logs = true

# ─────────────────────────────────────────────────────────────────────────
# PLANNED BINDINGS — deliberately inactive until the phase that owns them.
#
# [[r2_buckets]]      # media plane (replaces inline URLs / unsplash hotlinks) — still not needed: no
#                     # upload path exists, and a bucket with no writer is config theatre.
# (Phase 3 shipped the block above: [durable_objects.bindings] + [migrations].)
#
# [[d1_databases]]    # INTENTIONALLY ABSENT — do not "helpfully" add one.
# D1 would be a second copy of match data with a sync job in the middle. Supabase Postgres is the
# source of truth for every business table; D1 is only ever justified later for Worker-owned
# ephemeral state, and that needs its own reviewed migration. See workers/README.md.
# ─────────────────────────────────────────────────────────────────────────
