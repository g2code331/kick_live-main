# KickLive CI — build the SPA and deploy it to Cloudflare Pages. Source of truth for this file is
# ci/workflows/deploy-web.yml; `.github/workflows/deploy-web.yml` is a copy (see "npm run ci:install" /
# docs/RELEASE-PIPELINE.md §1). The web host is Cloudflare Pages (docs/DEPLOYMENT_VERIFICATION.md §10):
# same zone as the Worker, so the bundle and the API share a domain and the app talks to `/api` same-origin.
name: Deploy web

on:
  # A push to main deploys STAGING automatically. Production is not auto-deployed by a push: it is reached by an
  # explicit run (workflow_dispatch, or the release workflow on a tag) and, if you configure Environment
  # protection rules on the `production` environment, by a required approval. The reason is the same one the
  # repo already applies to the stable update channel — an artefact that a build produced is not automatically
  # an artefact somebody agreed to ship.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "packaging/**"
      - "*.md"
      - "supabase/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        type: choice
        required: true
        default: production
        options: [preview, staging, production]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dist/web (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # On a push (no `environment` input) the target is STAGING — see the trigger note above.
    #
    # The build is mode-scoped (`.env.staging` / `.env.production`, generated from workers/wrangler.toml) and the
    # GitHub environment may still override the same two names. Overriding is what makes a staging bundle and a
    # production bundle from ONE commit possible; the mode file is what makes "the operator forgot to export a
    # pair" impossible. Both are checked, and src/lib/env.ts then refuses at boot on any disagreement between
    # the URL, the key's `ref` claim and the VITE_EXPECTED_PROJECT_REF the mode file bakes in — a 401 from
    # GoTrue on the login page is the symptom of that disagreement, which is what this comment is for.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: "Secrets audit (optional here: a missing key still builds, it just ships the fallback backend)"
        run: node scripts/check-secrets.mjs --job=web || echo "::warning::continuing the web deploy with unset optional secrets"
      - name: "Build — mode-scoped, the pair comes from .env.<target> generated from the Worker's own config"
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.environment || 'staging' }}"
          case "$target" in
            production) mode=production ;;
            *)          mode=staging ;;
          esac
          npm run "web:env:check"          # the committed .env.<mode> must still match workers/wrangler.toml
          npm run "build:web:$mode"
        env:
          # Optional overrides, per GitHub environment. Left unset, the mode file is the source of truth — which
          # is the point: an empty `${{ secrets.X }}` used to be *inlined into the bundle* by Vite.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Assert the built bundle is servable (404s stay 404s, JS stays JS)
        # --web-only: this job ran `build:web:<mode>` and nothing else, so there is no renderer/dist
        # and no build/electron. Plain `verify-packaging` demands both (tier A1), so it failed here
        # on every run while passing in the desktop job that builds them.
        run: node scripts/verify-packaging.mjs --web-only
      - id: ver
        name: Version of what is being deployed
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          grep -o 'name="kicklive:version" content="[^"]*"' dist/web/index.html || echo "note: the version meta is stamped at runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: web-deploy-bundle
          path: dist/web
          if-no-files-found: error

  deploy:
    name: Pages deploy (${{ github.event.inputs.environment || 'staging' }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Secrets audit
        run: node scripts/check-secrets.mjs --job=deploy-web
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.environment || 'staging' }}"
          # One Pages project per deployed environment; a preview is a branch of the production project,
          # which is what gives it an isolated *.pages.dev URL without a third project to maintain.
          case "$target" in
            production) project="kicklive-web";         branch="main" ;;
            staging)    project="kicklive-web-staging"; branch="main" ;;
            preview)    project="kicklive-web";         branch="pr-$GITHUB_RUN_ID" ;;
          esac
          missing=0
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            # Diagnostic that never leaks the value: report only whether the secret arrived and its
            # length. An empty length here means the `staging` environment did not inject the secret
            # into this job (wrong environment, wrong name, or the value was saved empty); a non-zero
            # length means the secret is present and any failure below is wrangler's, not GitHub's.
            val="${!s:-}"
            echo "secret $s: length=${#val}"
            if [ -z "$val" ]; then echo "::error::$s is not set: the web deploy cannot run. Configure it under Settings → Environments → $target (or repository secrets); see docs/ENVIRONMENT_SETUP.md §3."; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          # From here on, name the sub-command that fails so a red step is not a mystery.
          trap 'echo "::error::deploy step failed at: ${BASH_COMMAND}"' ERR
          npm ci --no-audit --no-fund
          # Rebuild here rather than shipping the artifact from the build job: Pages wants a directory, the
          # artifact round-trip would lose the hashed-asset names in index.html's preload hints, and a second
          # mode-scoped build costs 30s and is provably the same bytes (web:env:check ran on both jobs).
          case "$target" in
            production) mode=production ;;
            *)          mode=staging ;;
          esac
          npm run "web:env:check"
          npm run "build:web:$mode"
          out=$(npx --yes wrangler@4 pages deploy dist/web --project-name "$project" --branch "$branch" 2>&1)
          echo "$out"
          # Pages prints one or two *.pages.dev URLs; the last is this deployment's own.
          url=$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]*pages\.dev[^ ]*' | tail -1)
          [ -n "$url" ] || { echo "::error::could not parse a Pages URL from the deploy output"; exit 1; }
          echo "deployed=$url" >> "$GITHUB_ENV"
          echo "### Web deploy ($target → $project)" >> "$GITHUB_STEP_SUMMARY"
          echo "- bundle version: \`${{ needs.build.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Post-deploy probe (the deployed host must honour the 404/MIME contract)
        if: env.deployed != ''
        run: bash scripts/ci/probe-deploy.sh "$deployed"
