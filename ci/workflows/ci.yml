# KickLive CI — PR/push quality gate. Source of truth for this file is ci/workflows/ci.yml;
# `.github/workflows/ci.yml` is a copy (see "npm run ci:install" / docs/RELEASE-PIPELINE.md §1).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.18.0"

jobs:
  quality:
    name: Gates 1+4+5 (typecheck, tests, policy, branding)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Workflows installed from ci/workflows
        run: npm run ci:check
      - name: Typecheck (renderer+shared, scripts+server+desktop)
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Aggregate verify (branding, version, hooks, Pages contract, manifest templates)
        run: npm run verify
      - name: Unit + integration tests
        run: npm test
      - name: Update contract (manifest samples)
        run: |
          node scripts/update-manifest.mjs validate packaging/updates/manifest.sample.json
          node scripts/update-manifest.mjs validate packaging/updates/manifest.beta.json
      - name: Gate summary
        if: always()
        run: |
          {
            echo "### Gate 1/4/5 summary"
            echo '```'
            node scripts/gates.mjs --only=1,4,5 --skip=6 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Gates 2+3 (web build, packaging layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build web + PWA + renderer + desktop bundles
        run: npm run build
      - name: "Layout tests (tier A: renderer/dist, asar, hooks, identity, version)"
        run: node scripts/verify-packaging.mjs
      - name: Serve the built web bundle and assert the static-server contract
        # `mime()` must print the header VALUE only. An earlier revision matched the header with a
        # case-insensitive `~` but then called `sub(k," ")` with a lowercase `k`; awk's sub() is
        # case-sensitive, so the substitution never happened and every content-type assertion
        # compared "Content-Type: text/javascript; …" against "text/javascript; …" and failed.
        # Splitting on ": " and lowering only the field name makes the comparison exact.
        run: |
          # Launch through the repo's ts-loader (the same one `npm run serve:web` uses) rather than
          # relying on `node`'s native type-stripping: a raw `node server/cli.ts` fails to start on a
          # runner whose Node build strips types differently, and the only symptom is "server never
          # came up". A `trap` dumps the server log so a real failure is diagnosable from the run page.
          node --import ./scripts/lib/ts-loader.mjs server/cli.ts --root dist/web --port 4173 --quiet >/tmp/serve.log 2>&1 & echo $! > /tmp/serve.pid
          trap 'echo "--- static server log ---"; cat /tmp/serve.log 2>/dev/null || true' EXIT
          set -e
          code() { curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:4173$1"; }
          mime() { curl -sSI "http://127.0.0.1:4173$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}'; }
          # `sleep 1` is a race: wait for the socket to answer instead.
          for _ in $(seq 1 40); do
            [ "$(code / 2>/dev/null || true)" = "200" ] && break
            sleep 0.5
          done
          test "$(code /)" = 200 || { echo "::error::the static server never came up on 4173"; exit 1; }
          test "$(code /admin/anything)" = 200
          [ "$(code /assets/nope-does-not-exist.js)" = 404 ] || { echo "missing asset must 404"; exit 1; }
          JS=$(ls dist/web/assets/*.js | head -1 | xargs basename)
          test "$(code /assets/$JS)" = 200
          # A JS MIME type is what lets the browser run the bundle as a module at all.
          test "$(mime /assets/$JS)" = "text/javascript; charset=utf-8" || {
            echo "::error::/assets/$JS served as [$(mime /assets/$JS)], expected [text/javascript; charset=utf-8]"; exit 1; }
          # The manifest is compared as a media type, not an exact string: server/mime.ts appends
          # "; charset=utf-8", and both forms are correct per RFC 9110 §8.3.
          case "$(mime /site.webmanifest)" in
            application/manifest+json*) ;;
            *) echo "::error::/site.webmanifest served as [$(mime /site.webmanifest)], expected application/manifest+json"; exit 1;;
          esac
          kill "$(cat /tmp/serve.pid)"
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-web-dist
          path: dist/web
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-renderer-dist
          path: renderer/dist
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Gates 2+3 (Linux .deb/AppImage + xvfb smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install X11/packaging tools
        run: bash scripts/ci/setup-linux-tools.sh
      - name: Build everything
        run: npm run build
      - name: Package Linux artifacts (electron-builder)
        run: npm run package:linux -- --require-full
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      - uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: "Full layout tests (tier B + C: linux-unpacked, .deb fields, desktop file, icons)"
        run: node scripts/verify-packaging.mjs --require-full
      - name: Smoke the built binary under xvfb (happy path + broken load path)
        run: bash scripts/ci/desktop-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicklive-smoke-logs
          path: release/smoke-*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-deb
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kicklive-packaging-report
          path: |
            release/packaging-report.json
            release/checksums.json
            release/artifacts.json
          if-no-files-found: error
          retention-days: 30
